name: AelionSigns
version: ${version}
main: com.aelion.plugins.signs.SignsPaperPlugin
api-version: "1.21"
author: Aelion Solutions
description: Panel-driven join/status signs for Aelion Cloud
website: https://github.com/Aelion-Solutions/aelion-cloud-plugins
softdepend: []
depend:
  - AelionAero
commands:
  aesign:
    description: Manage Aelion Signs
    usage: /aesign <create|remove|removeall|cleanup|reload> ...
    aliases: [signs]
    permission: aelion.signs.admin
permissions:
  aelion.signs.admin:
    description: Create and manage signs
    default: op
  aelion.signs.knockback.bypass:
    description: Bypass sign-area knockback
    default: false
