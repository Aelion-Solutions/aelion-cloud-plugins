name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash ./gradlew build --no-daemon
        env:
          # Prefer classic PAT with read:packages (cross-repo Packages).
          # Fallback GITHUB_TOKEN only works if aero-api package grants this repo access.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.AERO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
