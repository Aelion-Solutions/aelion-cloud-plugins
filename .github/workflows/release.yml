name: Release

# release-please opens a Release PR on main (review/approve/merge).
# After merge it tags + creates the GitHub Release; we then attach plugin JARs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  release-please:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 15
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: main

  publish-jars:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          VERSION="${TAG##*v}"
          echo "Building with version=$VERSION"
          bash ./gradlew build --no-daemon -Pversion="$VERSION"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.AERO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${TAG##*v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la npcs-paper/build/libs/ \
            signs-bukkit-1_8/build/libs/ \
            signs-bukkit-1_13/build/libs/ \
            signs-paper-1_17/build/libs/ \
            signs-paper-1_21/build/libs/ \
            signs-paper-26/build/libs/ || true
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            compat/signs-compat.yml
            npcs-paper/build/libs/aelion-npcs-${{ steps.version.outputs.version }}.jar
            signs-bukkit-1_8/build/libs/aelion-signs-bukkit-1_8-${{ steps.version.outputs.version }}.jar
            signs-bukkit-1_13/build/libs/aelion-signs-bukkit-1_13-${{ steps.version.outputs.version }}.jar
            signs-paper-1_17/build/libs/aelion-signs-paper-1_17-${{ steps.version.outputs.version }}.jar
            signs-paper-1_21/build/libs/aelion-signs-paper-1_21-${{ steps.version.outputs.version }}.jar
            signs-paper-26/build/libs/aelion-signs-paper-26-${{ steps.version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
